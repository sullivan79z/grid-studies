<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>方格 / Grid Studies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="welcome" class="screen welcome">
      <div class="brand">方格<span> / GRID STUDIES</span></div>
      <div class="welcome-content"><div class="index">01 / 空间的基本单位</div><h1>从一格开始。</h1><p>一张可测量的数字网格纸。用于体块推敲、空间模数与平面构思。</p><button id="welcome-next" class="primary">开始 <span>↗</span></button></div>
      <div class="welcome-foot">DRAW · MEASURE · THINK</div>
      <div class="sample-grid" aria-hidden="true"></div>
    </section>
    <section id="setup" class="screen setup hidden">
      <header><div class="brand">方格<span> / GRID STUDIES</span></div><button id="skip" class="text-button">跳过设置 ↗</button></header>
      <div class="setup-content"><div class="index">02 / 定义网格</div><h1>选择一种起点。</h1><p>实际尺度和屏幕显示尺寸独立，可随时调整。</p>
        <div class="methods" role="radiogroup" aria-label="初始化方式">
          <label class="method"><input type="radio" name="method" value="length" checked><span class="method-number">01</span><strong>按边长</strong><small>为每格指定实际尺寸</small></label>
          <label class="method"><input type="radio" name="method" value="area"><span class="method-number">02</span><strong>按面积</strong><small>由面积计算正方形边长</small></label>
          <label class="method"><input type="radio" name="method" value="count"><span class="method-number">03</span><strong>按数量</strong><small>完整显示指定行列数</small></label>
        </div>
        <div id="setup-fields" class="setup-fields"></div><p id="setup-error" class="error" role="alert"></p>
        <button id="enter" class="primary">进入画布 <span>↗</span></button>
      </div>
    </section>
    <section id="workspace" class="screen workspace hidden">
      <header class="workspace-head"><div class="brand">方格<span> / GRID STUDIES</span></div><div id="scale-indicator" class="scale-indicator"></div><button id="settings-toggle" class="top-button" aria-expanded="false">设置 <span>⌘</span></button></header>
      <div id="canvas-area" class="canvas-area"><canvas id="drawing" aria-label="交互式网格画布"></canvas><div id="measure" class="measure hidden" aria-live="off"></div><div id="canvas-hint" class="canvas-hint">拖动填色 · 直线终点停留 2 秒后垂直拖动生成矩形</div></div>
      <div class="toolbar" role="toolbar" aria-label="绘制工具"><button id="tool-fill" class="active" aria-pressed="true">填色</button><button id="tool-erase" aria-pressed="false">擦除</button><span class="divider"></span><button id="undo" title="撤销上一步">撤销</button></div>
      <div id="settings" class="settings hidden" role="dialog" aria-label="网格设置"><div class="settings-head"><strong>网格设置</strong><button id="settings-close" aria-label="关闭设置">×</button></div>
        <label class="field-label" for="size-range">显示尺寸 <span id="size-value">40 px</span></label><input id="size-range" type="range" min="12" max="100" value="40"><div class="inline-field"><input id="size-number" type="number" min="8" max="200" value="40"><span>px / 格</span></div>
        <div id="actual-controls" class="actual-controls hidden"><label class="field-label" for="actual-number">实际边长</label><div class="inline-field"><input id="actual-number" type="number" min="0.000001" step="any"><select id="actual-unit"><option value="m">m</option><option value="cm">cm</option><option value="mm">mm</option></select></div></div>
        <label class="field-label" for="grid-color">网格线颜色</label><div class="color-row"><input id="grid-color" type="color" value="#c6c9ca"><span id="color-label">#C6C9CA</span></div>
        <label class="field-label" for="image-input">底图</label><input id="image-input" type="file" accept="image/png,image/jpeg"><div id="image-options" class="image-options hidden"><label for="image-opacity">透明度 <span id="opacity-value">40%</span></label><input id="image-opacity" type="range" min="0" max="100" value="40"><button id="image-remove" class="text-button">删除底图</button></div>
        <button id="clear" class="clear-button">清空全部填色</button>
      </div>
      <div id="confirm" class="confirm hidden" role="dialog" aria-modal="true" aria-label="确认清空"><div class="confirm-box"><strong>清空画布？</strong><p>所有已填格子将被删除。</p><div><button id="cancel-clear">取消</button><button id="confirm-clear">确认清空</button></div></div></div>
    </section>
  </main><script src="main.js"></script>
</body></html>
